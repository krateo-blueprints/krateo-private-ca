# krateo-private-ca
#
# REQUIRED OF THE CLUSTER, installed BEFORE this chart (this chart ships only custom resources, so
# their CRDs must already exist; one release cannot carry both):
#   1. cert-manager with its built-in auto-approver DISABLED (chart v1.21.x: `disableAutoApproval: true`).
#      Without it every CertificateRequest is approved by cert-manager itself and the policies below
#      constrain nothing.
#   2. cert-manager-approver-policy (tested: v0.29.0).
#   3. trust-manager (tested: v0.26.0) with `app.trust.namespace` = this release's namespace and
#      `app.webhook.tls.approverPolicy.enabled: true` (its own webhook certificate needs approval too).
#
# INSTALL INTO cert-manager's cluster resource namespace (by default `cert-manager`): a ClusterIssuer
# reads its CA Secret from that namespace, and trust-manager reads Bundle sources from its trust
# namespace, which this chart pins to the release namespace. The render refuses any other layout.

# The CA itself: a self-signed root, issued once, kept for its whole life.
ca:
  # Name of the ClusterIssuer that signs service certificates, of the CA Certificate and of its Secret.
  name: krateo-private-ca
  commonName: Krateo Private CA
  # 10 years. The private key is never rotated on renewal (rotationPolicy Never), so renewing the CA
  # keeps the same public key and every published trust bundle stays valid.
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256

# cert-manager's controller ServiceAccount: it is the requester of every CertificateRequest created
# from a Certificate, so the policies below are granted to it ("use" on each policy).
certManager:
  serviceAccount:
    name: cert-manager
    namespace: cert-manager

# What the CA may sign. Each entry becomes one CertificateRequestPolicy that approves a request ONLY
# when it comes from one of `namespaces`, references this CA's ClusterIssuer, and asks for nothing
# beyond `dnsNames` (exact names) with server-auth usages. Empty by default: a fresh install signs
# nothing until a consumer declares what it needs.
#
# Example (the Keycloak service of the keycloak blueprint):
#   issuance:
#     - name: keycloak
#       namespaces:
#         - keycloak-system
#       dnsNames:
#         - keycloak-service.keycloak-system.svc
#         - keycloak-service.keycloak-system.svc.cluster.local
issuance: []
# Optional upper bound on the certificate lifetime the issuance policies approve, e.g. 2160h. Empty =
# no bound. When set, approver-policy DENIES any request that does not state a duration, so every
# consumer's Certificate must then set `spec.duration` (at most this value): measured, a Certificate
# without one is refused with `spec.constraints.maxDuration: Invalid value: "nil"`.
maxDuration: ""

# Publication of the CA certificate. trust-manager writes it as a ConfigMap named `bundle.name`,
# key `bundle.key`, into every namespace in `bundle.namespaces` (namespaces created later included).
bundle:
  enabled: true
  name: krateo-private-ca
  key: ca.crt
  namespaces: []

# The namespace trust-manager reads Bundle sources from (its `app.trust.namespace`). MUST equal the
# release namespace, which must also be cert-manager's cluster resource namespace (checked at render).
trustNamespace: cert-manager
