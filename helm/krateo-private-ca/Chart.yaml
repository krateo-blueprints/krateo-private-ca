apiVersion: v2
name: krateo-private-ca
description: >-
  A private certificate authority for in-cluster TLS: a cert-manager ClusterIssuer backed by a
  self-signed CA, approver-policy policies so that issuer signs ONLY the names each service is
  allowed, and a trust-manager Bundle publishing the CA certificate into the namespaces that must
  trust it. Requires cert-manager (auto-approval disabled), approver-policy and trust-manager to be
  installed first (see README).
type: application
version: CHART_VERSION
appVersion: "1.0.0"
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
home: https://github.com/krateo-blueprints/krateo-private-ca
# Helm's `sources` is the source code of THIS chart; release tooling resolves the chart version as a
# tag in each listed repository, so only this repository belongs here.
sources:
  - https://github.com/krateo-blueprints/krateo-private-ca
keywords:
  - cert-manager
  - approver-policy
  - trust-manager
  - private-ca
maintainers:
  - name: krateo
